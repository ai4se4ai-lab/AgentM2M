name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentm2m/schema run build
      - run: pnpm --filter @agentm2m/schema test
      - run: pnpm --filter @agentm2m/engine run build
      - name: Engine unit + HTTP tests (excludes the real-Ollama integration test — no Ollama server in CI)
        run: pnpm --filter @agentm2m/engine exec vitest run --exclude test/integration
      - run: pnpm --filter @agentm2m/dashboard run build
        continue-on-error: true # dashboard build may still be stabilizing; see docs/architecture.md

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
