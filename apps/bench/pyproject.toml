[project]
name = "agentm2m-bench"
version = "0.1.0"
description = "AgentM2M benchmark & evaluation service: SWE-bench-family fetchers, Docker execution harness, RQ1/RQ3 evaluation runners."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "datasets>=2.19",
  "pandas>=2.0",
  "docker>=7.0",
  "swebench>=5.0",
  "pydantic>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: test actually invokes the Docker daemon and runs a real SWE-bench instance container",
  "slow: test that fetches real data over the network or runs a real container",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.datasets", "app.harness", "app.baselines"]
